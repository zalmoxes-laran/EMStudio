# EM dev-stack — a LIGHT local object-storage stack for the Resource layer's
# MinIO tier (dev AND local real-work without a remote server).
#
# Default (`up.sh dev`)        = just MinIO + a one-shot bucket init.
# With auth (`up.sh dev auth`) = adds Keycloak + Postgres (compose profile `auth`).
#
# Reuses Heriverse's S3_* conventions and the shared `heriverse` bucket, so bytes
# land in the SAME keyspace whether local-dev, the full stack, or the remote
# StratiGraph/WP6 deploy. Public images only (no registry auth). Every value has a
# dev default via ${VAR:-default}, so this file validates and runs even with no
# .env — copy .env.example → .env to customise. This is a STANDALONE dev profile;
# it does not modify Heriverse-Docker's production compose.
#
# NOTE on endpoints: inside this compose network, services reach MinIO at
# http://minio:9000 (used by `createbuckets` below). A HOST process (em-bridge)
# must use http://localhost:${S3_PORT} — that is what S3_ENDPOINT in .env is for.

services:
  # ── MinIO / S3 object store ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: em-dev-minio
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"  # web console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ── one-shot: create the shared bucket + turn ON versioning ───────────────────
  # Versioning makes updates non-destructive: a resource keeps its stable ID and
  # MinIO keeps the object's history. Idempotent — safe to re-run.
  createbuckets:
    image: minio/mc:latest
    container_name: em-dev-createbuckets
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >
        until /usr/bin/mc alias set local http://minio:9000
        "${S3_ACCESS_KEY_ID:-admin}" "${S3_SECRET_ACCESS_KEY:-password}";
        do echo 'waiting for minio…'; sleep 2; done;
        /usr/bin/mc mb --ignore-existing "local/${S3_BUCKET:-heriverse}";
        /usr/bin/mc version enable "local/${S3_BUCKET:-heriverse}";
        echo "bucket '${S3_BUCKET:-heriverse}' ready (versioning enabled)";

  # ── optional auth (compose profile `auth`) ────────────────────────────────────
  postgres:
    image: postgres:18
    container_name: em-dev-postgres
    profiles: ["auth"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: em-dev-keycloak
    profiles: ["auth"]
    depends_on:
      - postgres
    restart: unless-stopped
    command: ["start-dev"]   # dev mode: HTTP, no TLS, no realm import
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

volumes:
  minio_data:
  postgres_data:
